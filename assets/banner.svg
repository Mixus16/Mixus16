<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="MIXUS — Estudio de desarrollo de software">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4D3D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF4D3D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo (tema MARK3) -->
  <rect width="1200" height="400" fill="#140A08"/>

  <!-- Circuito de fondo -->
  <g stroke="#FF4D3D" stroke-opacity="0.08" stroke-width="1" fill="none">
    <path d="M0 80 H240 L280 120 H520"/>
    <path d="M0 340 H180 L220 300 H420 L460 340 H700"/>
    <path d="M1200 60 H1020 L980 100 H860"/>
    <path d="M1200 320 H1080 L1040 280 H940"/>
    <path d="M640 400 V330 L600 290 V220"/>
    <path d="M120 0 V60 L160 100 V150"/>
  </g>
  <g fill="#FF4D3D" fill-opacity="0.25">
    <circle cx="520" cy="120" r="2.5"/>
    <circle cx="700" cy="340" r="2.5"/>
    <circle cx="860" cy="100" r="2.5"/>
    <circle cx="940" cy="280" r="2.5"/>
    <circle cx="600" cy="220" r="2.5"/>
    <circle cx="160" cy="150" r="2.5"/>
  </g>

  <!-- Marco con esquinas acentuadas (como los paneles de la web) -->
  <rect x="24" y="24" width="1152" height="352" fill="none" stroke="#FF4D3D" stroke-opacity="0.15"/>
  <path d="M24 56 V24 H56" fill="none" stroke="#FF4D3D" stroke-width="3"/>
  <path d="M1144 24 H1176 V56" fill="none" stroke="#FF4D3D" stroke-width="3"/>
  <path d="M1176 344 V376 H1144" fill="none" stroke="#FF4D3D" stroke-width="3"/>
  <path d="M56 376 H24 V344" fill="none" stroke="#FF4D3D" stroke-width="3"/>

  <!-- Esfera de partículas (núcleo Mixus) -->
  <g transform="translate(960,200)">
    <circle r="120" fill="url(#halo)"/>
    <g fill="#FF4D3D">
      <g fill-opacity="0.9">
        <circle cx="0" cy="-95" r="2.2"/><circle cx="55" cy="-77" r="2.2"/><circle cx="90" cy="-30" r="2.2"/>
        <circle cx="90" cy="30" r="2.2"/><circle cx="55" cy="77" r="2.2"/><circle cx="0" cy="95" r="2.2"/>
        <circle cx="-55" cy="77" r="2.2"/><circle cx="-90" cy="30" r="2.2"/><circle cx="-90" cy="-30" r="2.2"/>
        <circle cx="-55" cy="-77" r="2.2"/>
      </g>
      <g fill-opacity="0.55">
        <circle cx="0" cy="-65" r="1.8"/><circle cx="46" cy="-46" r="1.8"/><circle cx="65" cy="0" r="1.8"/>
        <circle cx="46" cy="46" r="1.8"/><circle cx="0" cy="65" r="1.8"/><circle cx="-46" cy="46" r="1.8"/>
        <circle cx="-65" cy="0" r="1.8"/><circle cx="-46" cy="-46" r="1.8"/>
      </g>
      <g fill-opacity="0.35">
        <circle cx="0" cy="-35" r="1.5"/><circle cx="30" cy="-18" r="1.5"/><circle cx="30" cy="18" r="1.5"/>
        <circle cx="0" cy="35" r="1.5"/><circle cx="-30" cy="18" r="1.5"/><circle cx="-30" cy="-18" r="1.5"/>
      </g>
    </g>
    <ellipse rx="118" ry="34" fill="none" stroke="#FF4D3D" stroke-opacity="0.35" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="118" ry="34" transform="rotate(60)" fill="none" stroke="#FF4D3D" stroke-opacity="0.22" stroke-width="1"/>
    <ellipse rx="118" ry="34" transform="rotate(-60)" fill="none" stroke="#FF4D3D" stroke-opacity="0.22" stroke-width="1"/>
    <circle r="6" fill="#FF4D3D" filter="url(#glow)">
      <animate attributeName="fill-opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Texto -->
  <g font-family="'Cascadia Code','Consolas','Courier New',monospace">
    <text x="80" y="118" font-size="15" letter-spacing="5" fill="#FF4D3D">// ESTUDIO DE DESARROLLO DE SOFTWARE</text>
    <text x="80" y="330" font-size="12" letter-spacing="4" fill="#8A6F68">RESPUESTA &lt; 24 HS · CONSULTA SIN CARGO · MIXUS.PRO</text>
  </g>
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700">
    <text x="78" y="185" font-size="54" fill="#F5EFED">Desarrollamos software</text>
    <text x="78" y="245" font-size="54" fill="#F5EFED">que <tspan fill="#FF4D3D" filter="url(#glow)">impulsa negocios</tspan>.</text>
  </g>
  <text x="80" y="288" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#B8A49E">IA, automatización, aplicaciones y soluciones digitales a medida.</text>
</svg>
